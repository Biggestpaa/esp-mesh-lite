name: Build Mesh-Lite Leaf & Root (ESP32-S3)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [leaf, root]

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util

      - name: Clone ESP-IDF (release v5.4, pinned)
        run: |
          git clone --depth 1 --branch release/v5.4 https://github.com/espressif/esp-idf.git $HOME/esp-idf

      - name: Install ESP-IDF tools
        run: |
          cd $HOME/esp-idf
          ./install.sh esp32s3

      - name: Export ESP-IDF environment
        run: |
          echo "$HOME/esp-idf/tools" >> $GITHUB_PATH
          echo "IDF_PATH=$HOME/esp-idf" >> $GITHUB_ENV

      - name: Select sdkconfig.defaults for role
        run: |
          cd examples/no_router
          if [ "${{ matrix.role }}" = "root" ]; then
            cp sdkconfig.defaults.root sdkconfig.defaults
          else
            cp sdkconfig.defaults.leaf sdkconfig.defaults
          fi
          cat sdkconfig.defaults

      - name: Build firmware
        shell: bash
        run: |
          source $HOME/esp-idf/export.sh
          cd examples/no_router
          idf.py set-target esp32s3
          idf.py build
          idf.py merge-bin

      - name: Dump build logs on failure
        if: failure()
        run: |
          cd examples/no_router
          echo "=== Build log dir ==="
          ls -lah build/log || true

          echo "=== STDERR logs (first 300 lines each) ==="
          for f in build/log/idf_py_stderr_output_*; do
            echo "----- $f -----"
            sed -n '1,300p' "$f" || true
            echo
          done

          echo "=== STDOUT logs (first 300 lines each) ==="
          for f in build/log/idf_py_stdout_output_*; do
            echo "----- $f -----"
            sed -n '1,300p' "$f" || true
            echo
          done

          echo "=== CMakeError/CMakeOutput if present ==="
          find build -maxdepth 3 -type f \( -name "CMakeError.log" -o -name "CMakeOutput.log" \) -print -exec sed -n '1,300p' {} \; || true

          echo "=== Ninja verbose (if build.ninja exists) ==="
          test -f build/build.ninja && (cd build && ninja -v -k 0) || true

      - name: Collect artifacts
        run: |
          OUT="artifacts_${{ matrix.role }}"
          mkdir -p "$OUT"
          cp examples/no_router/build/*.bin "$OUT/" || true
          cp examples/no_router/build/*.elf "$OUT/" || true
          cp examples/no_router/build/*.map "$OUT/" || true
          cp examples/no_router/build/flasher_args.json "$OUT/" || true
          cp examples/no_router/build/merged*.bin "$OUT/" || true
          ls -lah "$OUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesh-lite-${{ matrix.role }}-esp32s3
          path: artifacts_${{ matrix.role }}
